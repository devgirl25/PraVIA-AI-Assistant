name: pravia
description: "PraVIA - Personal Jarvis-style AI Assistant"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Voice: speech-to-text + text-to-speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # App control: launch other apps via Android intents / package queries
  device_apps: ^2.2.0
  android_intent_plus: ^5.1.0

  # Contacts + calling
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

  # SMS (Android only, sends without opening default SMS app)
  telephony: ^0.2.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3
  path_provider: ^2.1.4

  # Networking (talk to FastAPI backend)
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
